<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Review Queue · Stories of Service</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header>
    <div class="tag">Reviewers only</div>
    <h1>Review Queue</h1>
    <p>Watch each story before it goes up. Approve it to post it on the wall, hide it to take it down, or delete it for good.</p>
  </header>

  <section id="signin" hidden>
    <form class="panel" id="loginForm" novalidate>
      <label for="loginEmail">Reviewer email<input type="email" id="loginEmail" autocomplete="email" required></label>
      <div class="btns"><button type="submit" class="primary" id="loginBtn">Email me a sign-in link</button></div>
      <div class="msg" id="loginMsg" role="status" hidden></div>
    </form>
  </section>

  <section id="denied" hidden>
    <div class="panel">
      <p style="margin:0">You're signed in as <strong id="whoDenied"></strong>, but that email isn't on the reviewer list.</p>
      <div class="btns"><button type="button" class="signout">Sign out</button></div>
    </div>
  </section>

  <section id="queue" hidden>
    <div class="tabs">
      <button type="button" data-view="pending" aria-pressed="true">Waiting <span data-count="pending"></span></button>
      <button type="button" data-view="approved" aria-pressed="false">Posted <span data-count="approved"></span></button>
      <button type="button" data-view="hidden" aria-pressed="false">Hidden <span data-count="hidden"></span></button>
    </div>
    <div class="wall" id="list"></div>
  </section>

  <footer><a href="./">Back to the wall</a><span id="who"></span><button type="button" class="small signout" id="signoutBtn" hidden>Sign out</button></footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="admin.js"></script>
</body>
</html>
